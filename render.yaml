services:
  - type: web
    name: producer-calendar-team
    env: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Producer Calendar
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: CALENDAR_USERNAME
        value: andy.davis
      - key: CALENDAR_PASSWORD
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: organizations
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: GRAPH_DEFAULT_RECIPIENTS
        sync: false
      - key: GRAPH_SEND_ATTACHMENTS
        value: "true"
